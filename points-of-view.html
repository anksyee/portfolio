<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>POST · RESHARE · OPENING · VOID — THE SLOP ENGINE</title>
<style>
:root{
  --bg:#ffffff;
  --ink:#111111;
  --dim:#8a8a84;
  --faint:#e3e3de;
  --red:#c96a64;
  --mono:ui-monospace,'SF Mono','Menlo','Consolas',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;font-family:var(--mono);color:var(--ink)}
#graph{position:fixed;inset:0;display:block;cursor:grab}
#graph.drag{cursor:grabbing}

.hud{position:fixed;top:18px;left:18px;z-index:5;background:rgba(255,255,255,.92);border:1px solid var(--faint);padding:14px 16px;min-width:320px;pointer-events:none}
.hud .line{font-size:12px;letter-spacing:.14em;color:var(--dim);margin-bottom:9px}
.hud .line b{color:var(--ink);font-weight:600}
.hud .line b.red{color:var(--red)}
.bar-label{font-size:9px;letter-spacing:.26em;color:var(--dim);margin:8px 0 5px}
.meter{width:100%;height:7px;background:#f4f4f1;border:1px solid var(--faint)}
#meterFill{height:100%;width:0%;background:var(--red);transition:width .45s ease}
.status{font-size:10px;letter-spacing:.2em;margin-top:10px;color:var(--dim)}
.status .no{color:var(--red)}
.status .void{color:var(--ink);border:1px solid var(--ink);padding:1px 7px;display:inline-block}
.thin-note{margin-top:11px;font-size:9px;letter-spacing:.12em;color:#b3b3ac;line-height:1.6}

#controls{position:fixed;left:18px;bottom:18px;z-index:5;display:flex;flex-wrap:wrap;gap:8px;max-width:640px}
#controls button{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--ink);background:#fff;border:1px solid #d8d8d2;padding:9px 13px;cursor:pointer;transition:.15s}
#controls button:hover{background:#f2f2ee}
#controls button.sat{color:var(--red);border-color:rgba(201,106,100,.5)}
#controls button.sat:hover{background:#fbf3f2}
#controls button.void-btn{font-weight:700;border:2px solid var(--ink);background:#111;color:#fff}
#controls button.void-btn:hover{background:#000}
#controls label{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.16em;color:var(--dim);border:1px solid var(--faint);padding:9px 13px;cursor:pointer;user-select:none}
#controls input{accent-color:var(--red);cursor:pointer}
#controls label.on{color:var(--ink)}

#panel{position:fixed;top:18px;right:18px;z-index:5;width:430px;max-width:calc(100vw - 36px);max-height:72vh;overflow:auto;background:rgba(255,255,255,.97);border:1px solid var(--faint);padding:16px;display:none}
#panel.open{display:block}
#panel h3{font-size:12px;letter-spacing:.2em;color:var(--ink);margin-bottom:4px}
#panel .canon{font-size:10px;letter-spacing:.1em;color:var(--dim);margin-bottom:13px;padding-bottom:11px;border-bottom:1px dashed var(--faint)}
.vi{font-size:10.5px;letter-spacing:.06em;line-height:1.7;color:var(--ink);padding:8px 9px;border:1px solid var(--faint);margin-bottom:7px;background:#fafaf7}
.vi .pf{color:var(--dim);letter-spacing:.18em;font-size:9px;display:block}
.vi.conf{border-color:rgba(201,106,100,.55);background:#fbf1f0}
.vi .badge{color:var(--red);font-size:9px;letter-spacing:.16em;padding-left:8px}
.vi .diffs{font-size:9px;color:var(--dim);display:block;margin-top:4px;letter-spacing:.08em}
.vi .actor{color:#b3b3ac;font-size:9px;letter-spacing:.1em}
#panel .none{font-size:10px;letter-spacing:.14em;color:var(--dim);padding:8px 0}
#panel .close{position:sticky;top:0;float:right;background:none;border:1px solid var(--faint);color:var(--dim);font-family:var(--mono);font-size:11px;padding:4px 9px;cursor:pointer}
#panel .close:hover{color:var(--ink);border-color:#111}
#hint{position:fixed;bottom:18px;right:18px;z-index:4;font-size:9px;letter-spacing:.2em;color:#c4c4bd;pointer-events:none}
#tooltip{position:fixed;z-index:6;pointer-events:none;background:#fff;border:1px solid #ddd;padding:6px 9px;font-size:10px;line-height:1.7;color:var(--ink);display:none;max-width:340px;box-shadow:0 2px 14px rgba(0,0,0,.08)}
#flash{position:fixed;left:18px;bottom:84px;z-index:7;display:none;border:1px solid var(--red);color:var(--red);background:#fff;padding:8px 12px;font-size:10px;letter-spacing:.16em;pointer-events:none}
</style>
</head>
<body>
<canvas id="graph"></canvas>

<div class="hud">
  <div class="line">VIEWS <b id="cViews">0</b> · WORKS <b id="cWorks">1</b> · GLUING FAILURES <b id="cConf">0</b></div>
  <div class="bar-label">NON-TOTALISABILITY</div>
  <div class="meter"><div id="meterFill"></div></div>
  <div class="status">TOTALISABLE: <span id="stat">YES</span></div>
</div>

<div id="controls">
  <button class="sat" data-k="instagram">+ IG POST</button>
  <button class="sat" data-k="reshare">+ RESHARE</button>
  <button class="sat" data-k="opening">+ OPENING</button>
  <button class="sat" data-k="resale">+ RESALE (INFLATE PRICE)</button>
  <button class="void-btn" data-k="void">+ THE VOID</button>
  <button id="reset">RESET TO BASICS</button>
  <label id="ghostLbl"><input type="checkbox" id="ghost" /> GHOST OF THE STRIATION</label>
</div>

<div id="panel"></div>
<div id="hint">DRAG TO PAN · SCROLL TO ZOOM · CLICK A WORK</div>
<div id="tooltip"></div>
<div id="flash"></div>

<script>
'use strict';

/* ================= state =================
   the slop lifecycle:  artist → gallery → critic → public → void
   post on ig → reshares → opening buzz → and then the void.        */
const POS_IDS = ['artist','gallery','critic','public','collector','void'];
const POS_XY = {
  artist:[8,30], gallery:[28,30], critic:[48,26], public:[48,34],
  collector:[62,30], void:[78,30]
};
const CHAIN = [
  ['artist','gallery'],['gallery','critic'],['critic','public'],
  ['public','collector'],['collector','void']
];
const GHOST = [
  ['artist','critic'],['artist','public'],['artist','collector'],['artist','void'],
  ['gallery','public'],['gallery','collector'],['gallery','void'],
  ['critic','collector'],['critic','void'],['public','void']
];
const COLLECT_AT = 2; /* inflations needed before the work can be collected */
let collected = false;
const PLATFORM_LABEL = {instagram:'IG POST', reshare:'RESHARE', opening:'OPENING', resale:'RESALE'};

let nodes = [], links = [], views = [], works = [];
let vid = 0, K = 0, ghostOn = false;
let voided = false;            /* the terminal: artist ends in the void  */
let inflations = 0;            /* price inflated ⇒ gallery swells, artist shrinks,
                                  and the work starts moving toward the collector   */
let traction = 0;              /* artist gets traction from everything, never huge */
const WORK_ANCHOR = {x:POS_XY.artist[0]+6, y:POS_XY.artist[1]-7};

let work = null;
function seed(){
  work = {
    id:'w-01', type:'work', title:'Untitled (IX)', price:4000, prov:'Artist, 2024',
    views:[], label:'W-01', pinned:true,
    x:WORK_ANCHOR.x, y:WORK_ANCHOR.y, fx:WORK_ANCHOR.x, fy:WORK_ANCHOR.y
  };
  works = [work];
  views = []; vid = 0; K = 0; voided = false; inflations = 0; traction = 0; collected = false;
  nodes = POS_IDS.map(id => {
    const p = POS_XY[id];
    return { id, type:'position', label: id.toUpperCase(),
      x:p[0], y:p[1], pinned:true, fx:p[0], fy:p[1] };
  });
  nodes.push(work);
  links = [];
  CHAIN.forEach(([s,t]) => links.push({source:s, target:t, kind:'given', conflict:false}));
  links.push({source:'artist', target:'w-01', kind:'work-flow', conflict:false});
}
seed();

/* ================= drift ================= */
const TITLE_POOL = ['Untitled (IX)','WW','untitled','Untitled (IX) #2','Untitled [2]','WW (Untitled)','Untitled (IX) — framed','Untitled (faded)','Untitled (IX) [1]','W·W'];
const PROV_POOL  = ['Artist, 2024','Artist, 2023','Acquired from collector, 2023','Private collection, unlisted','Artist studio, 2024','Acquired from artist, 2024','Estate of the artist, 2023','Courtesy of a private space, 2024','Location unknown'];
const DRIFT = {
  instagram:{p:[0.45,0.3,0.3], lo:0.85, hi:1.25},
  reshare:  {p:[0.6,0.45,0.4], lo:0.7, hi:1.6},
  opening:  {p:[0.35,0.4,0.5], lo:0.9, hi:1.35},
  resale:   {p:[1.0,0.35,0.55], lo:1.6, hi:2.4}
};
const rnd = a => a[Math.floor(Math.random()*a.length)];
const pickDiff = (pool, cur) => {
  let v;
  for(let i=0;i<5;i++){ v = rnd(pool); if(v!==cur) break; }
  return v;
};
const priceDrift = (p,cfg) => Math.max(300, Math.round(p*(cfg.lo + Math.random()*(cfg.hi-cfg.lo))/50)*50);
function drift(rec, kind){
  const src = DRIFT[kind];
  const out = {title:rec.title, price:rec.price, prov:rec.prov};
  if(Math.random()<src.p[0]) out.price = priceDrift(out.price, src);
  if(Math.random()<src.p[1]) out.title = pickDiff(TITLE_POOL, out.title);
  if(Math.random()<src.p[2]) out.prov = pickDiff(PROV_POOL, out.prov);
  return out;
}

/* ================= event engine =================
   ig post:     public reacts strongly · gallery bit · artist traction
   reshare:     public strongly · gallery operates · artist traction
   opening:     CRITICS activate · public a bit · gallery operates · artist traction
   resale:      price inflated · gallery EXPANDS · artist SHRINKS
   void:        everything drains in · artist ends in the void               */
let flashTo = null;
function flashMsg(txt){
  const el = document.getElementById('flash');
  el.textContent = txt;
  el.style.display = 'block';
  clearTimeout(flashTo);
  flashTo = setTimeout(() => { el.style.display = 'none'; }, 2400);
}
function addEvent(kind){
  if(kind==='void'){
    if(!collected && inflations < COLLECT_AT){
      flashMsg('NOT COLLECTED — INFLATE THE PRICE FIRST (×'+COLLECT_AT+')');
      return;
    }
    collected = true;
    voided = true;
    refresh();
    return;
  }
  const base = {title:work.title, price:work.price, prov:work.prov};

  function record(actor, plat, rec){
    rec = rec || drift(base, plat);
    const v = {
      id:'v-'+(++vid), type:'view', platform:plat, actor,
      label: PLATFORM_LABEL[plat], rec, workId:work.id, conflict:false,
      x: POS_XY[actor][0] + (Math.random()-0.5)*7,
      y: POS_XY[actor][1] + (Math.random()-0.5)*7, vx:0, vy:0
    };
    views.push(v); work.views.push(v); nodes.push(v);
    links.push({source:v.id, target:'w-01', kind:'view-work', conflict:false});
    links.push({source:v.id, target:actor, kind:'actor', conflict:false});
    links.push({source:v.id, target:'void', kind:'drain', conflict:false, v});
    return v;
  }

  if(kind==='instagram'){
    record('public','instagram');
    record('public','instagram');
    if(Math.random()<0.5) record('gallery','instagram');
    traction = Math.min(0.55, traction + 0.14);
  }
  if(kind==='reshare'){
    record('public','reshare');
    record('public','reshare');
    record('gallery','reshare');
    traction = Math.min(0.55, traction + 0.12);
  }
  if(kind==='opening'){
    record('critic','opening');
    record('critic','opening');
    record('gallery','opening');
    record('public','opening');
    traction = Math.min(0.55, traction + 0.1);
  }
  if(kind==='resale'){
    const rec = {...base, price: priceDrift(base.price, DRIFT.resale)};
    if(Math.random()<0.35) rec.title = pickDiff(TITLE_POOL, base.title);
    if(Math.random()<0.55) rec.prov = pickDiff(PROV_POOL, base.prov);
    record('gallery','resale', rec);
    record('public','resale', {...rec, price: rec.price + (Math.random()*300|0)});
    inflations++;
    traction = Math.min(0.55, traction + 0.05);
  }
  refresh();
}

/* ================= gluing ================= */
function recompute(){
  views.forEach(v => v.conflict = false);
  let k = 0;
  const vs = work.views;
  for(let i=0;i<vs.length;i++) for(let j=i+1;j<vs.length;j++){
    const a=vs[i], b=vs[j];
    if(a.rec.title!==b.rec.title || a.rec.price!==b.rec.price || a.rec.prov!==b.rec.prov){
      k++; a.conflict = true; b.conflict = true;
    }
  }
  links.forEach(l => { if(l.kind==='drain') l.conflict = l.v ? l.v.conflict : false; });
  return k;
}

/* ================= canvas / view ================= */
const canvas = document.getElementById('graph');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
let cam = {ox:0, oy:0, zoom:0};
function resize(){
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
}
window.addEventListener('resize', resize);
resize();
function fit(){
  cam.zoom = Math.min(W/110, H/60);
  cam.ox = (POS_XY.artist[0]+POS_XY.void[0])/2;
  cam.oy = 30;
}
fit();
const sx = (x,y) => [(x-cam.ox)*cam.zoom + W/2, (y-cam.oy)*cam.zoom + H/2];

/* ================= physics ================= */
function nodeById(id){ for(const n of nodes) if(n.id===id) return n; return null; }
function step(){
  const ITER = 4, DT = 0.16;
  /* the void is terminal — when it fires, the artist is drawn in */
  if(voided){
    const artist = nodeById('artist'), v = nodeById('void');
    artist.pinned = false;
    artist.x += (v.x-artist.x)*0.006;
    artist.y += (v.y-artist.y)*0.006;
    /* the collected work travels through the collector into the void */
    if(work.pinned) work.pinned = false;
    work.x += (v.x-work.x)*0.004;
    work.y += (v.y-work.y)*0.004;
  } else {
    /* inflation pulls the work toward the collector: it must inflate
       before it can be collected — and collected means the void */
    const t = Math.min(1, inflations / COLLECT_AT);
    work.fx = WORK_ANCHOR.x + (POS_XY.collector[0]-WORK_ANCHOR.x)*t;
    work.fy = WORK_ANCHOR.y + (POS_XY.collector[1]-WORK_ANCHOR.y)*t;
    work.x = work.fx; work.y = work.fy;
  }
  for(let it=0; it<ITER; it++){
    links.forEach(l => {
      const a = nodeById(l.source), b = nodeById(l.target);
      if(!a || !b) return;
      let rest = 7;
      if(l.kind==='drain') rest = 24;
      if(l.kind==='given') rest = 12;
      if(l.kind==='work-flow') rest = 7;
      if(l.kind==='view-work') rest = 5;
      if(l.kind==='actor') rest = 4;
      const dx = b.x-a.x, dy = b.y-a.y;
      const d = Math.hypot(dx,dy) || 0.001;
      const f = (d-rest)*0.02*DT;
      const fx = dx/d*f, fy = dy/d*f;
      if(!a.pinned){ a.x += fx; a.y += fy; }
      if(!b.pinned){ b.x -= fx; b.y -= fy; }
    });
    for(let i=0;i<nodes.length;i++){
      const a = nodes[i];
      if(a.pinned) continue;
      for(let j=i+1;j<nodes.length;j++){
        const b = nodes[j];
        if(a.pinned && b.pinned) continue;
        const dx = a.x-b.x, dy = a.y-b.y;
        const d2 = dx*dx+dy*dy;
        const d = Math.sqrt(d2) || 0.01;
        if(d < 14){
          const f = 14/(d2+0.4)*0.02*DT*d*1.4;
          a.x += dx/d*f; a.y += dy/d*f;
          if(!b.pinned){ b.x -= dx/d*f; b.y -= dy/d*f; }
        }
      }
    }
  }
}

/* ================= particles ================= */
const parts = []; let partsStale = true;
function rebuildParts(){
  parts.length = 0;
  links.forEach(l => {
    if(l.kind!=='drain') return;
    const n = l.conflict ? 3 : (voided ? 1 : 2);
    for(let i=0;i<n;i++){
      parts.push({source:l.source, target:'void', u:i/n, speed:0.008, conflict:l.conflict});
    }
  });
  partsStale = false;
}
function ensureParts(){ if(partsStale) rebuildParts(); }

/* ================= draw ================= */
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(-cam.ox, -cam.oy);

  const nViews = views.length;

  /* links */
  links.forEach(l => {
    const a = nodeById(l.source), b = nodeById(l.target);
    if(!a || !b) return;
    if(l.kind==='ghost'){
      if(!ghostOn) return;
      ctx.strokeStyle = '#c9c9c3';
      ctx.lineWidth = 0.5;
      ctx.setLineDash([1.3, 2.2]);
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
      return;
    }
    let col = '#8f8f89', w = 0.55;
    if(l.kind==='given')      { col = '#2e2e2c'; w = 1.0; }
    if(l.kind==='work-flow')  { col = '#44443f'; w = 0.9; }
    if(l.kind==='view-work')  { col = '#b9b9b2'; w = 0.5; }
    if(l.kind==='actor')      { col = l.v && l.v.conflict ? '#c96a64' : '#7d7d76'; w = 0.9; }
    if(l.kind==='drain'){
      col = voided ? '#d5d5cf' : (l.conflict ? '#c96a64' : '#bdbdb6');
      w = 0.6;
      if(voided) col = '#dcdcd6';
    }
    ctx.strokeStyle = col;
    ctx.lineWidth = w;
    ctx.globalAlpha = 0.95;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(a.x,a.y);
    ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    ctx.globalAlpha = 1;
    if(l.kind!=='ghost' && l.kind!=='drain'){
      const ang = Math.atan2(b.y-a.y, b.x-a.x);
      const ex = b.x - Math.cos(ang)*1.4, ey = b.y - Math.sin(ang)*1.4;
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(b.x,b.y);
      ctx.lineTo(ex - Math.sin(ang)*1.0, ey + Math.cos(ang)*1.0);
      ctx.lineTo(ex + Math.sin(ang)*1.0, ey - Math.cos(ang)*1.0);
      ctx.closePath(); ctx.fill();
    }
  });

  /* particles — the drain into the void */
  parts.forEach(p => {
    const a = nodeById(p.source), b = nodeById('void');
    if(!a || !b) return;
    p.u += p.speed;
    if(p.u > 1) p.u -= 1;
    const x = a.x+(b.x-a.x)*p.u, y = a.y+(b.y-a.y)*p.u;
    ctx.fillStyle = (p.conflict && !voided) ? '#c96a64' : '#d8d8d2';
    ctx.beginPath(); ctx.arc(x, y, 0.42, 0, 6.283); ctx.fill();
  });

  /* nodes */
  let actorR = {critic:1.8 + critRecords()*0.5, public:2.0 + publicRecords()*0.3};
  const galleryR = 2.0 + inflations*1.0 + galleryRecords()*0.18;
  function critRecords(){ return views.filter(v=>v.actor==='critic').length; }
  function publicRecords(){ return views.filter(v=>v.actor==='public').length; }
  function galleryRecords(){ return views.filter(v=>v.actor==='gallery').length; }
  nodes.forEach(n => {
    let col, r, op = 1, glow = false;
    if(n.type==='position'){
      col = '#111111'; r = 2.0;
      if(n.id==='artist'){
        const shrink = Math.max(0.15, Math.pow(0.8, inflations));
        r = (2.0 + traction) * shrink;
        if(voided) r = 0.3;
        op = voided ? 0.05 : (1 - Math.min(0.7, inflations*0.14));
      }
      if(n.id==='public') r = actorR.public + (voided?1.2:0);
      if(n.id==='critic') r = actorR.critic;
      if(n.id==='gallery') r = galleryR;
      if(n.id==='collector'){ r = 2.1 + inflations*0.6 + (collected?1.0:0); col = '#111111'; }
      if(n.id==='void') r = voided ? 7.5 : 2.1;
      if(n.id==='void') col = voided ? '#000000' : '#3a3a38';
    } else if(n.type==='work'){
      col = '#55554f'; r = 1.6;
    } else {
      const muted = voided;
      col = (n.conflict && !muted) ? '#c96a64' : (muted ? '#c6c6c0' : '#6b6b65');
      r = n.conflict && !muted ? 1.45 : 1.1;
      glow = n.conflict && !muted;
    }
    ctx.globalAlpha = op;
    if(glow){ ctx.shadowColor = '#c96a64'; ctx.shadowBlur = 9; }
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 6.283); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  });

  ctx.restore();

  /* labels (screen space) */
  ctx.textAlign = 'center';
  nodes.forEach(n => {
    const [xs,ys] = sx(n.x, n.y);
    if(n.type==='position'){
      let rpx;
      if(n.id==='artist') rpx = ( (2.0+traction)*Math.max(0.15,Math.pow(0.8,inflations)) ) * cam.zoom;
      else if(n.id==='public') rpx = (2.0+views.filter(v=>v.actor==='public').length*0.3) * cam.zoom;
      else if(n.id==='critic') rpx = (1.8+views.filter(v=>v.actor==='critic').length*0.5) * cam.zoom;
      else if(n.id==='gallery') rpx = (2.0+inflations*1.0+galleryRecords()*0.18) * cam.zoom;
      else if(n.id==='collector') rpx = (2.1+inflations*0.6+(collected?1.0:0)) * cam.zoom;
      else rpx = (voided?7.5:2.1) * cam.zoom;
      ctx.font = '600 12px '+MONO;
      const lbl = n.label.toUpperCase();
      const baseline = n.id==='void' ? ys + rpx + 15 : ys - rpx - 9;
      const wpx = ctx.measureText(lbl).width;
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      ctx.fillRect(xs - wpx/2 - 5, baseline - 11, wpx + 10, 15);
      ctx.fillStyle = n.id==='void' ? '#88888f' : '#111';
      ctx.globalAlpha = n.id==='artist' ? (voided ? 0.25 : Math.max(0.3, 1-inflations*0.15)) : 1;
      ctx.fillText(lbl, xs, baseline);
      ctx.globalAlpha = 1;
    } else if(n.type==='work'){
      ctx.font = '9px '+MONO;
      ctx.fillStyle = '#8a8a84';
      ctx.fillText('W-01', xs, ys - 13);
    }
  });

  /* tooltip */
  const tip = document.getElementById('tooltip');
  if(hover){
    const [xs,ys] = sx(hover.x, hover.y);
    tip.style.display = 'block';
    tip.style.left = Math.min(W-340, xs+16)+'px';
    tip.style.top = (ys-10)+'px';
    tip.innerHTML = tipOf(hover);
  } else tip.style.display = 'none';
}
const MONO = 'ui-monospace, SF Mono, Menlo, Consolas, monospace';
function tipOf(n){
  if(n.type==='position') return `${n.label} — POSITION`;
  if(n.type==='work') {
    return `W-01<br>canon: ${work.title} · $${work.price.toLocaleString()} · ${work.prov}<br>views: ${work.views.length}<br><span style="color:#8a8a84">click to inspect</span>`;
  }
  return `<b>${PLATFORM_LABEL[n.platform]}</b> · ${n.actor.toUpperCase()}<br>$${n.rec.price.toLocaleString()} · ${n.rec.title} · ${n.rec.prov}<br>${n.conflict?'<span style="color:#c96a64">× CONFLICT</span>':'consistent'}`;
}

/* ================= loop ================= */
let hover = null;
function loop(){
  step(); ensureParts(); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ================= HUD ================= */
function updateHUD(){
  document.getElementById('cViews').textContent = views.length;
  document.getElementById('cWorks').textContent = works.length;
  const cConf = document.getElementById('cConf');
  cConf.textContent = K;
  cConf.className = K>0 ? 'red' : '';
  document.getElementById('meterFill').style.width = Math.min(100, K*3) + '%';
  const st = document.getElementById('stat');
  if(voided){
    st.innerHTML = '<span class="void">VOIDED</span>';
  } else {
    st.textContent = K>0 ? 'NO' : 'YES';
    st.className = K>0 ? 'no' : '';
  }
}

/* ================= panel ================= */
function openPanel(wrk){
  const p = document.getElementById('panel');
  let html = `<button class="close" id="closeP">✕ CLOSE</button>
    <h3>W-01 — ${wrk.title}${inflations?' · PRICE INFLATED':''}</h3>
    <div class="canon">CANON: ${wrk.title} · $${wrk.price.toLocaleString()} · ${wrk.prov}</div>`;
  if(!wrk.views.length){
    html += `<div class="none">NO POINTS OF VIEW YET — SILENCE.</div>`;
  } else {
    wrk.views.forEach(v => {
      const diffs = [];
      if(v.rec.title!==wrk.title) diffs.push('title');
      if(v.rec.price!==wrk.price) diffs.push('price');
      if(v.rec.prov!==wrk.prov) diffs.push('provenance');
      const parts = diffs.length ? `<span class="diffs">differs from canon: ${diffs.join(' · ')}</span>` : '';
      html += `<div class="vi ${v.conflict?'conf':''}">
        <span class="pf">${PLATFORM_LABEL[v.platform]} <span class="actor">— ${v.actor.toUpperCase()} ACTIVATED</span>${v.conflict?' <span class="badge">× CONFLICT</span>':''}</span>
        $${v.rec.price.toLocaleString()} · ${v.rec.title} · ${v.rec.prov}${parts}
      </div>`;
    });
  }
  p.innerHTML = html;
  p.classList.add('open');
  document.getElementById('closeP').onclick = () => p.classList.remove('open');
}

/* ================= interaction ================= */
let dragging = false, moved = 0, px = 0, py = 0;
canvas.addEventListener('mousedown', e => {
  dragging = true; moved = 0; px = e.clientX; py = e.clientY;
  canvas.classList.add('drag');
});
window.addEventListener('mousemove', e => {
  if(dragging){
    const dx = e.clientX-px, dy = e.clientY-py;
    moved += Math.abs(dx)+Math.abs(dy);
    cam.ox -= dx/cam.zoom; cam.oy -= dy/cam.zoom;
    px = e.clientX; py = e.clientY;
  }
  hover = null;
  let best = 18;
  for(const n of nodes){
    const [xs,ys] = sx(n.x,n.y);
    const d = Math.hypot(xs-e.clientX, ys-e.clientY);
    if(d < best){ best = d; hover = n; }
  }
  canvas.style.cursor = hover && hover.type==='work' ? 'pointer' : (dragging ? 'grabbing' : 'grab');
});
window.addEventListener('mouseup', e => {
  dragging = false;
  canvas.classList.remove('drag');
  if(moved < 5){
    let best = 18, hit = null;
    for(const n of nodes){
      const [xs,ys] = sx(n.x,n.y);
      const d = Math.hypot(xs-e.clientX, ys-e.clientY);
      if(d < best){ best = d; hit = n; }
    }
    if(hit && hit.type==='work') openPanel(hit);
  }
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  cam.zoom = Math.min(14, Math.max(0.8, cam.zoom * Math.exp(-e.deltaY*0.0012)));
}, {passive:false});

/* ================= controls ================= */
function refresh(){
  K = recompute();
  partsStale = true;
  updateHUD();
}
const controlsEl = document.getElementById('controls');
controlsEl.addEventListener('click', e => {
  const b = e.target.closest('button[data-k]');
  if(b){ addEvent(b.dataset.k); return; }
  if(e.target.closest('#reset')){
    seed(); refresh();
    document.getElementById('panel').classList.remove('open');
  }
});
controlsEl.addEventListener('change', e => {
  if(e.target && e.target.id === 'ghost'){
    ghostOn = e.target.checked;
    document.getElementById('ghostLbl').classList.toggle('on', ghostOn);
    const has = links.some(l => l.kind==='ghost');
    if(ghostOn && !has){
      GHOST.forEach(([s,t]) => links.push({source:s, target:t, kind:'ghost', conflict:false}));
    } else if(!ghostOn && has){
      links = links.filter(l => l.kind!=='ghost');
    }
  }
});
refresh();
</script>
